<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гомологи и Изомеры</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0f19;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .chem-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Квадратные чекбоксы */
        .sq-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #475569;
            border-radius: 6px;
            background-color: #0b0f19;
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .sq-checkbox:checked {
            background-color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
        }

        .sq-checkbox::before {
            content: "";
            width: 12px;
            height: 12px;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            background-color: #082f49;
            transition: 0.12s transform ease-in-out;
        }

        .sq-checkbox:checked::before {
            transform: scale(1);
        }

        /* Горизонтальная прокрутка для длинных цепей на смартфоне */
        .formula-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }

        .formula-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .formula-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .formula-scroll::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }

        /* Единый 2D-рендерер структурных формул */
        .chem-chain {
            display: inline-flex;
            align-items: stretch;
            padding: 4px 2px;
            min-width: min-content;
        }

        .chem-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .chem-slot-rad-top {
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #93c5fd;
            white-space: nowrap;
            line-height: 1;
        }

        .chem-slot-vbond-top {
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #64748b;
            line-height: 1;
        }

        /* Цифра нумерации СТРОГО НАД группой CH3 / CH2 / CH / C */
        .chem-slot-num {
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            line-height: 1;
            margin-bottom: 3px;
            user-select: none;
        }

        /* Главная углеродная группа без цифр внутри */
        .chem-slot-main {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            padding: 0 2px;
            line-height: 1;
        }

        /* Горизонтальная связь строго на одной линии с главной цепью */
        .chem-slot-hbond {
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            color: #94a3b8;
            font-weight: 700;
            font-size: 16px;
            line-height: 1;
            user-select: none;
        }

        .chem-slot-vbond-bot {
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            color: #64748b;
            line-height: 1;
        }

        .chem-slot-rad-bot {
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            white-space: nowrap;
            line-height: 1;
        }

        .h-sub {
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            vertical-align: sub;
            line-height: 0;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <main class="max-w-[480px] mx-auto px-3 pt-3 space-y-3">

        <!-- Панель управления -->
        <section class="bg-[#131b2e] border border-slate-800 rounded-2xl p-3.5 shadow-xl space-y-3">
            <input 
                id="chemInput" 
                type="text" 
                value="2,4-диметилпентан"
                placeholder="Введите вещество..."
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                class="w-full bg-[#0b0f19] border border-slate-700 focus:border-sky-400 rounded-xl px-3.5 py-2.5 text-[16px] font-semibold text-white placeholder-slate-500 focus:outline-none transition-colors"
            />

            <div class="flex items-center justify-between gap-2 pt-0.5">
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input id="chkHomologues" type="checkbox" checked class="sq-checkbox" />
                        <span class="text-sm font-bold text-slate-200">±Г</span>
                    </label>

                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input id="chkIsomers" type="checkbox" checked class="sq-checkbox" />
                        <span class="text-sm font-bold text-slate-200">Изомеры</span>
                    </label>
                </div>

                <button 
                    id="solveBtn"
                    type="button"
                    class="bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950 font-extrabold text-sm px-5 py-2.5 rounded-xl shadow-lg shadow-sky-500/20 transition-all cursor-pointer"
                >
                    Решить
                </button>
            </div>
        </section>

        <!-- Вывод решения -->
        <div id="outputContainer" class="space-y-3"></div>

    </main>

    <script>
        /* Словарь корней по числу углеродов */
        const ROOTS_BY_COUNT = {
            1: { root: 'мет', nameAlkane: 'метан', carbons: 1 },
            2: { root: 'эт', nameAlkane: 'этан', carbons: 2 },
            3: { root: 'проп', nameAlkane: 'пропан', carbons: 3 },
            4: { root: 'бут', nameAlkane: 'бутан', carbons: 4 },
            5: { root: 'пент', nameAlkane: 'пентан', carbons: 5 },
            6: { root: 'гекс', nameAlkane: 'гексан', carbons: 6 },
            7: { root: 'гепт', nameAlkane: 'гептан', carbons: 7 },
            8: { root: 'окт', nameAlkane: 'октан', carbons: 8 },
            9: { root: 'нон', nameAlkane: 'нонан', carbons: 9 },
            10: { root: 'дек', nameAlkane: 'декан', carbons: 10 },
            11: { root: 'ундек', nameAlkane: 'ундекан', carbons: 11 },
            12: { root: 'додек', nameAlkane: 'додекан', carbons: 12 }
        };

        const ROOT_PATTERNS = [
            { pattern: 'додек', carbons: 12 },
            { pattern: 'ундек', carbons: 11 },
            { pattern: 'пент', carbons: 5 },
            { pattern: 'проп', carbons: 3 },
            { pattern: 'гекс', carbons: 6 },
            { pattern: 'гепт', carbons: 7 },
            { pattern: 'бут', carbons: 4 },
            { pattern: 'окт', carbons: 8 },
            { pattern: 'нон', carbons: 9 },
            { pattern: 'дек', carbons: 10 },
            { pattern: 'мет', carbons: 1 },
            { pattern: 'эт', carbons: 2 }
        ];

        const RADICAL_TYPES = {
            'метил': { name: 'метил', html: 'CH<span class="h-sub">3</span>', carbons: 1, hydrogens: 3 },
            'этил': { name: 'этил', html: 'C<span class="h-sub">2</span>H<span class="h-sub">5</span>', carbons: 2, hydrogens: 5 },
            'пропил': { name: 'пропил', html: 'C<span class="h-sub">3</span>H<span class="h-sub">7</span>', carbons: 3, hydrogens: 7 },
            'изопропил': { name: 'изопропил', html: 'CH(CH<span class="h-sub">3</span>)<span class="h-sub">2</span>', carbons: 3, hydrogens: 7 },
            'бутил': { name: 'бутил', html: 'C<span class="h-sub">4</span>H<span class="h-sub">9</span>', carbons: 4, hydrogens: 9 }
        };

        const MULTIPLIERS = { 1: '', 2: 'ди', 3: 'три', 4: 'тетра', 5: 'пента', 6: 'гекса' };

        /* Исправление частых опечаток и нормализация строки */
        function normalizeInput(rawInput) {
            let s = (rawInput || '').toLowerCase().trim();
            if (!s) return '2,4-диметилпентан';

            s = s.replace(/(\d)\.(\d)/g, '$1,$2');

            const typoFixes = [
                { regex: /деметилентампан/g, replacement: 'диметилпентан' },
                { regex: /диметилентампан/g, replacement: 'диметилпентан' },
                { regex: /деметилпентан/g, replacement: 'диметилпентан' },
                { regex: /лентампан/g, replacement: 'лпентан' },
                { regex: /тампан/g, replacement: 'пентан' },
                { regex: /деметил/g, replacement: 'диметил' },
                { regex: /треметил/g, replacement: 'триметил' },
                { regex: /тетрометил/g, replacement: 'тетраметил' },
                { regex: /митил/g, replacement: 'метил' },
                { regex: /итил/g, replacement: 'этил' },
                { regex: /гиксан/g, replacement: 'гексан' },
                { regex: /гиптан/g, replacement: 'гептан' },
                { regex: /пинтан/g, replacement: 'пентан' },
                { regex: /актан/g, replacement: 'октан' },
                { regex: /нанан/g, replacement: 'нонан' },
                { regex: /дикан/g, replacement: 'декан' }
            ];

            for (let i = 0; i < typoFixes.length; i++) {
                s = s.replace(typoFixes[i].regex, typoFixes[i].replacement);
            }

            s = s.replace(/(\d)\s+([а-яёa-z])/gi, '$1-$2');
            s = s.replace(/([а-яёa-z])\s+(\d)/gi, '$1-$2');
            s = s.replace(/\s*-\s*/g, '-');
            s = s.replace(/\s*,\s*/g, ',');
            s = s.replace(/\s+/g, '');
            return s;
        }

        /* Построение углеродной цепи с проверкой валентности C = 4 */
        function buildChainStructure(chainLen, bondType, multipleBondLocant, substituents) {
            const carbons = [];
            for (let i = 1; i <= chainLen; i++) {
                carbons.push({
                    index: i,
                    leftBond: i === 1 ? 0 : 1,
                    rightBond: i === chainLen ? 0 : 1,
                    radicals: [],
                    hydrogens: 0
                });
            }

            if (bondType === 'ен' && multipleBondLocant && multipleBondLocant < chainLen) {
                carbons[multipleBondLocant - 1].rightBond = 2;
                carbons[multipleBondLocant].leftBond = 2;
            } else if (bondType === 'ин' && multipleBondLocant && multipleBondLocant < chainLen) {
                carbons[multipleBondLocant - 1].rightBond = 3;
                carbons[multipleBondLocant].leftBond = 3;
            }

            for (let i = 0; i < substituents.length; i++) {
                const sub = substituents[i];
                if (sub.pos >= 1 && sub.pos <= chainLen) {
                    const targetC = carbons[sub.pos - 1];
                    const usedValence = targetC.leftBond + targetC.rightBond + targetC.radicals.length;
                    if (usedValence < 4) {
                        targetC.radicals.push(sub);
                    }
                }
            }

            let totalCarbons = chainLen;
            let totalHydrogens = 0;

            for (let i = 0; i < carbons.length; i++) {
                const c = carbons[i];
                const usedValence = c.leftBond + c.rightBond + c.radicals.length;
                c.hydrogens = Math.max(0, 4 - usedValence);
                totalHydrogens += c.hydrogens;

                for (let r = 0; r < c.radicals.length; r++) {
                    totalCarbons += c.radicals[r].info.carbons;
                    totalHydrogens += c.radicals[r].info.hydrogens;
                }
            }

            return {
                carbons: carbons,
                totalCarbons: totalCarbons,
                totalHydrogens: totalHydrogens,
                formulaHtml: 'C<sub>' + (totalCarbons === 1 ? '' : totalCarbons) + '</sub>H<sub>' + totalHydrogens + '</sub>'
            };
        }

        /* Сборка канонического названия по ИЮПАК */
        function buildCanonicalNameFromParts(chainLen, bondType, multipleBondLocant, substituents) {
            const rootObj = ROOTS_BY_COUNT[chainLen] || ROOTS_BY_COUNT[5];
            let normalizedSubs = substituents.map(function(s) {
                return { pos: s.pos, type: s.type, info: s.info };
            });

            if (bondType === 'ан' && normalizedSubs.length > 0) {
                const fwd = normalizedSubs.map(function(s) { return s.pos; }).sort(function(a, b) { return a - b; });
                const rev = normalizedSubs.map(function(s) { return chainLen - s.pos + 1; }).sort(function(a, b) { return a - b; });
                let useRev = false;
                for (let i = 0; i < fwd.length; i++) {
                    if (rev[i] < fwd[i]) { useRev = true; break; }
                    if (rev[i] > fwd[i]) { useRev = false; break; }
                }
                if (useRev) {
                    normalizedSubs = normalizedSubs.map(function(s) {
                        return { pos: chainLen - s.pos + 1, type: s.type, info: s.info };
                    });
                }
            }

            const grouped = {};
            for (let i = 0; i < normalizedSubs.length; i++) {
                const s = normalizedSubs[i];
                if (!grouped[s.type]) grouped[s.type] = [];
                grouped[s.type].push(s.pos);
            }

            const types = Object.keys(grouped).sort();
            const prefixParts = [];
            for (let i = 0; i < types.length; i++) {
                const t = types[i];
                const locs = grouped[t].sort(function(a, b) { return a - b; });
                const mult = MULTIPLIERS[locs.length] || '';
                prefixParts.push(locs.join(',') + '-' + mult + t);
            }

            const prefixStr = prefixParts.join('-');
            const postLoc = (bondType !== 'ан' && multipleBondLocant) ? ('-' + multipleBondLocant) : '';
            return (prefixStr ? prefixStr + '-' : '') + rootObj.root + bondType + postLoc;
        }

        /* Полный разбор названия или брутто-формулы вещества */
        function parseChemicalSubstance(rawInput) {
            let working = normalizeInput(rawInput);

            // Поддержка брутто-формул вроде C7H16, C5H10, C4H6
            const formulaMatch = working.match(/^c(\d*)h(\d+)$/i);
            if (formulaMatch) {
                const cCount = formulaMatch[1] ? parseInt(formulaMatch[1], 10) : 1;
                const hCount = parseInt(formulaMatch[2], 10);
                if (cCount >= 1 && cCount <= 12 && ROOTS_BY_COUNT[cCount]) {
                    if (hCount === 2 * cCount + 2) working = ROOTS_BY_COUNT[cCount].nameAlkane;
                    else if (hCount === 2 * cCount && cCount >= 2) working = ROOTS_BY_COUNT[cCount].root + 'ен-1';
                    else if (hCount === 2 * cCount - 2 && cCount >= 2) working = ROOTS_BY_COUNT[cCount].root + 'ин-1';
                }
            }

            let bondType = 'ан';
            let multipleBondLocant = null;
            let suffixText = 'ан';
            let postLocantText = '';

            const suffixMatch = working.match(/(ан|ен|ин)(?:-?(\d+))?$/);
            let stemBeforeSuffix = working;

            if (suffixMatch) {
                bondType = suffixMatch[1];
                suffixText = bondType;
                if (suffixMatch[2]) {
                    multipleBondLocant = parseInt(suffixMatch[2], 10);
                    postLocantText = '-' + multipleBondLocant;
                } else if (bondType !== 'ан') {
                    multipleBondLocant = 1;
                }
                stemBeforeSuffix = working.slice(0, suffixMatch.index);
            }

            let matchedRoot = ROOTS_BY_COUNT[5];
            let prefixString = '';

            for (let i = 0; i < ROOT_PATTERNS.length; i++) {
                const rp = ROOT_PATTERNS[i];
                if (stemBeforeSuffix.endsWith(rp.pattern)) {
                    matchedRoot = ROOTS_BY_COUNT[rp.carbons];
                    prefixString = stemBeforeSuffix.slice(0, stemBeforeSuffix.length - rp.pattern.length);
                    break;
                }
            }

            prefixString = prefixString.replace(/-+$/, '');

            const substituents = [];
            if (prefixString.length > 0) {
                const radRegex = /(?:(\d+(?:,\d+)*)-?)?(ди|три|тетра|пента|гекса)?(изопропил|пропил|метил|этил|бутил)/g;
                let match;
                while ((match = radRegex.exec(prefixString)) !== null) {
                    const locantsStr = match[1];
                    const multStr = match[2] || '';
                    const radName = match[3];
                    const radInfo = RADICAL_TYPES[radName];

                    let positions = [];
                    if (locantsStr) {
                        const splitLocs = locantsStr.split(',');
                        for (let k = 0; k < splitLocs.length; k++) {
                            const num = parseInt(splitLocs[k], 10);
                            if (!isNaN(num)) positions.push(num);
                        }
                    } else {
                        const multCount = multStr === 'ди' ? 2 : multStr === 'три' ? 3 : multStr === 'тетра' ? 4 : 1;
                        for (let k = 0; k < multCount; k++) positions.push(2);
                    }

                    for (let k = 0; k < positions.length; k++) {
                        const safePos = Math.min(Math.max(1, positions[k]), matchedRoot.carbons);
                        substituents.push({ pos: safePos, type: radName, info: radInfo });
                    }
                }
            }

            const chainLen = matchedRoot.carbons;
            const structure = buildChainStructure(chainLen, bondType, multipleBondLocant, substituents);
            const canonicalName = (prefixString ? prefixString + '-' : '') + matchedRoot.root + suffixText + postLocantText;

            return {
                canonicalName: canonicalName,
                prefixText: prefixString,
                rootText: matchedRoot.root,
                suffixText: suffixText,
                postLocantText: postLocantText,
                chainLength: chainLen,
                bondType: bondType,
                multipleBondLocant: multipleBondLocant,
                substituents: substituents,
                structure: structure
            };
        }

        /* Генерация гомологов −Г и +Г */
        function generateHomologues(parsed) {
            let minusG = null;
            const totalC = parsed.structure.totalCarbons;
            const maxSubPos = parsed.substituents.reduce(function(max, s) {
                return Math.max(max, s.pos);
            }, 0);

            if (totalC > 1) {
                const newLen = parsed.chainLength - 1;
                const canKeepSubs = newLen >= 3 && maxSubPos <= newLen - 1;
                const safeLoc = parsed.multipleBondLocant ? Math.min(parsed.multipleBondLocant, Math.max(1, newLen - 1)) : null;

                if (canKeepSubs) {
                    const nameMinus = buildCanonicalNameFromParts(newLen, parsed.bondType, safeLoc, parsed.substituents);
                    minusG = parseChemicalSubstance(nameMinus);
                } else {
                    const targetC = totalC - 1;
                    if (parsed.substituents.length > 0 && targetC >= 4) {
                        const fallbackName = buildCanonicalNameFromParts(targetC - 1, parsed.bondType, safeLoc, [
                            { pos: 2, type: 'метил', info: RADICAL_TYPES['метил'] }
                        ]);
                        minusG = parseChemicalSubstance(fallbackName);
                    } else if (targetC >= 1) {
                        const fallbackName = buildCanonicalNameFromParts(targetC, parsed.bondType, safeLoc, []);
                        minusG = parseChemicalSubstance(fallbackName);
                    }
                }
            }

            const plusLen = Math.min(12, parsed.chainLength + 1);
            const namePlus = buildCanonicalNameFromParts(plusLen, parsed.bondType, parsed.multipleBondLocant, parsed.substituents);
            const plusG = parseChemicalSubstance(namePlus);

            return { minusG: minusG, plusG: plusG };
        }

        /* Генерация изомеров И1, И2, И3... */
        function generateIsomers(parsed) {
            const totalC = parsed.structure.totalCarbons;
            const bondType = parsed.bondType;
            const isomersMap = new Map();

            function addCandidate(chainLen, locant, subsList) {
                if (chainLen < 1 || chainLen > 12) return;
                for (let i = 0; i < subsList.length; i++) {
                    const s = subsList[i];
                    if (s.type === 'метил' && (s.pos <= 1 || s.pos >= chainLen)) return;
                    if (s.type === 'этил' && (s.pos <= 2 || s.pos >= chainLen - 1)) return;
                }
                const tempStruct = buildChainStructure(chainLen, bondType, locant, subsList);
                if (tempStruct.totalCarbons !== totalC) return;

                const name = buildCanonicalNameFromParts(chainLen, bondType, locant, subsList);
                if (!isomersMap.has(name)) {
                    isomersMap.set(name, parseChemicalSubstance(name));
                }
            }

            if (bondType === 'ан') {
                if (totalC <= 12) addCandidate(totalC, null, []);

                const len1 = totalC - 1;
                if (len1 >= 3 && len1 <= 12) {
                    for (let p = 2; p <= Math.floor(len1 / 2); p++) {
                        addCandidate(len1, null, [{ pos: p, type: 'метил', info: RADICAL_TYPES['метил'] }]);
                    }
                }

                const len2 = totalC - 2;
                if (len2 >= 3 && len2 <= 12) {
                    for (let p1 = 2; p1 <= len2 - 1; p1++) {
                        for (let p2 = p1; p2 <= len2 - 1; p2++) {
                            addCandidate(len2, null, [
                                { pos: p1, type: 'метил', info: RADICAL_TYPES['метил'] },
                                { pos: p2, type: 'метил', info: RADICAL_TYPES['метил'] }
                            ]);
                        }
                    }
                    for (let p = 3; p <= Math.floor(len2 / 2); p++) {
                        addCandidate(len2, null, [{ pos: p, type: 'этил', info: RADICAL_TYPES['этил'] }]);
                    }
                }

                const len3 = totalC - 3;
                if (len3 >= 4 && len3 <= 12) {
                    for (let p1 = 2; p1 <= len3 - 1; p1++) {
                        for (let p2 = p1; p2 <= len3 - 1; p2++) {
                            for (let p3 = p2; p3 <= len3 - 1; p3++) {
                                if (p1 === p2 && p2 === p3) continue;
                                addCandidate(len3, null, [
                                    { pos: p1, type: 'метил', info: RADICAL_TYPES['метил'] },
                                    { pos: p2, type: 'метил', info: RADICAL_TYPES['метил'] },
                                    { pos: p3, type: 'метил', info: RADICAL_TYPES['метил'] }
                                ]);
                            }
                        }
                    }
                }
            } else {
                for (let loc = 1; loc <= Math.floor(totalC / 2); loc++) {
                    addCandidate(totalC, loc, []);
                }
                const len1 = totalC - 1;
                if (len1 >= 3) {
                    for (let loc = 1; loc <= Math.floor(len1 / 2); loc++) {
                        for (let p = 2; p <= len1 - 1; p++) {
                            addCandidate(len1, loc, [{ pos: p, type: 'метил', info: RADICAL_TYPES['метил'] }]);
                        }
                    }
                }
            }

            const allList = Array.from(isomersMap.values());
            const filtered = allList.filter(function(item) {
                return item.canonicalName !== parsed.canonicalName;
            });
            return (filtered.length > 0 ? filtered : allList).slice(0, 8);
        }

        /* Морфемный разбор слова (приставка ¬, корень ∩, суффикс ∧) */
        function renderWordBreakdownHTML(parsed) {
            const prefix = parsed.prefixText ? parsed.prefixText + '-' : '';
            const root = parsed.rootText;
            const suffix = parsed.suffixText;
            const postLoc = parsed.postLocantText || '';

            let html = '<div class="inline-flex items-end flex-wrap gap-y-2 chem-mono text-xl font-extrabold tracking-tight pt-1">';

            if (prefix) {
                html += 
                    '<div class="inline-flex flex-col items-stretch mr-0.5">' +
                        '<svg class="w-full h-4 overflow-visible mb-0.5" viewBox="0 0 100 16" preserveAspectRatio="none">' +
                            '<path d="M 2 4 L 97 4 L 97 15" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
                        '</svg>' +
                        '<span class="text-sky-400 px-0.5 leading-none">' + prefix + '</span>' +
                    '</div>';
            }

            html += 
                '<div class="inline-flex flex-col items-stretch mr-0.5">' +
                    '<svg class="w-full h-4 overflow-visible mb-0.5" viewBox="0 0 100 16" preserveAspectRatio="none">' +
                        '<path d="M 3 15 Q 50 -3 97 15" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
                    '</svg>' +
                    '<span class="text-emerald-400 px-0.5 leading-none">' + root + '</span>' +
                '</div>';

            html += 
                '<div class="inline-flex flex-col items-stretch">' +
                    '<svg class="w-full h-4 overflow-visible mb-0.5" viewBox="0 0 100 16" preserveAspectRatio="none">' +
                        '<path d="M 4 15 L 50 3 L 96 15" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
                    '</svg>' +
                    '<span class="text-amber-400 px-0.5 leading-none">' + suffix + '</span>' +
                '</div>';

            if (postLoc) {
                html += '<span class="text-slate-300 leading-none pb-[1px]">' + postLoc + '</span>';
            }

            html += '</div>';
            return html;
        }

        /*
         * ЕДИНЫЙ РЕНДЕРЕР СТРУКТУРНОЙ ФОРМУЛЫ ДЛЯ ИСХОДНОГО ВЕЩЕСТВА, ГОМОЛОГОВ И ИЗОМЕРОВ.
         * Цифры 1, 2, 3, 4, 5... стоят СТРОГО СВЕРХУ над целыми группами CH3, CH2, CH, C.
         */
        function renderFormulaHTML(parsed) {
            const carbons = parsed.structure.carbons;
            const chainLen = carbons.length;
            const hasTopRadicals = carbons.some(function(c) { return c.radicals.length >= 2; });
            const hasBottomRadicals = carbons.some(function(c) { return c.radicals.length >= 1; });

            let colsHtml = '';

            for (let idx = 0; idx < chainLen; idx++) {
                const c = carbons[idx];
                const carbonNum = c.index;

                let hPart = '';
                if (c.hydrogens === 1) {
                    hPart = 'H';
                } else if (c.hydrogens > 1) {
                    hPart = 'H<span class="h-sub">' + c.hydrogens + '</span>';
                }

                // Группа главной цепи пишется слитно (например CH3, CH2, CH, C) БЕЗ цифр между буквами
                const mainGroupHtml = '<span>C' + hPart + '</span>';

                // Если у углерода 1 радикал — он всегда снизу, чтобы ряд цифр 1, 2, 3... сверху был полностью свободен
                const bottomRadHtml = c.radicals[0] ? c.radicals[0].info.html : '';
                const topRadHtml = c.radicals[1] ? c.radicals[1].info.html : '';

                colsHtml += '<div class="chem-col">';

                if (hasTopRadicals) {
                    colsHtml += '<div class="chem-slot-rad-top">' + topRadHtml + '</div>';
                    colsHtml += '<div class="chem-slot-vbond-top">' + (topRadHtml ? '|' : '') + '</div>';
                }

                // Строка с номером углерода СТРОГО НАД группой CH3 / CH2 / CH / C
                colsHtml += '<div class="chem-slot-num">' + carbonNum + '</div>';
                colsHtml += '<div class="chem-slot-main">' + mainGroupHtml + '</div>';

                if (hasBottomRadicals) {
                    colsHtml += '<div class="chem-slot-vbond-bot">' + (bottomRadHtml ? '|' : '') + '</div>';
                    colsHtml += '<div class="chem-slot-rad-bot">' + bottomRadHtml + '</div>';
                }

                colsHtml += '</div>';

                // Горизонтальная связь между соседними группами углерода
                if (idx < chainLen - 1) {
                    let bondSymbol = '—';
                    if (c.rightBond === 2) bondSymbol = '=';
                    else if (c.rightBond === 3) bondSymbol = '≡';

                    colsHtml += '<div class="chem-col">';
                    if (hasTopRadicals) {
                        colsHtml += '<div class="chem-slot-rad-top"></div>';
                        colsHtml += '<div class="chem-slot-vbond-top"></div>';
                    }
                    colsHtml += '<div class="chem-slot-num"></div>';
                    colsHtml += '<div class="chem-slot-hbond">' + bondSymbol + '</div>';
                    if (hasBottomRadicals) {
                        colsHtml += '<div class="chem-slot-vbond-bot"></div>';
                        colsHtml += '<div class="chem-slot-rad-bot"></div>';
                    }
                    colsHtml += '</div>';
                }
            }

            return (
                '<div class="formula-scroll bg-[#0b0f19]/90 border border-slate-800/90 rounded-xl px-3 py-2.5">' +
                    '<div class="chem-chain chem-mono">' +
                        colsHtml +
                    '</div>' +
                '</div>'
            );
        }

        /* Рендер одного столбика вычисления для гомологов */
        function renderColumnCalcHTML(origC, origH, sign, resC, resH) {
            const origCSub = origC === 1 ? '' : origC;
            const resCSub = resC === 1 ? '' : resC;

            return (
                '<div class="bg-[#0b0f19]/70 border border-slate-800/80 rounded-xl px-4 py-2.5 chem-mono inline-block">' +
                    '<div class="inline-grid grid-cols-[18px_auto] gap-x-1.5 text-sm font-bold leading-snug text-right">' +
                        '<span></span>' +
                        '<span class="text-slate-100">C<sub>' + origCSub + '</sub>H<sub>' + origH + '</sub></span>' +
                        '<span class="text-sky-400 text-center">' + sign + '</span>' +
                        '<span class="text-sky-400">CH<sub>2</sub></span>' +
                        '<span class="col-span-2 border-b-2 border-slate-600 my-1"></span>' +
                        '<span></span>' +
                        '<span class="text-emerald-400">C<sub>' + resCSub + '</sub>H<sub>' + resH + '</sub></span>' +
                    '</div>' +
                '</div>'
            );
        }

        /* Главная функция решения */
        function solve() {
            const inputEl = document.getElementById('chemInput');
            const showHomologues = document.getElementById('chkHomologues').checked;
            const showIsomers = document.getElementById('chkIsomers').checked;
            const out = document.getElementById('outputContainer');

            const parsed = parseChemicalSubstance(inputEl.value);
            const cOrig = parsed.structure.totalCarbons;
            const hOrig = parsed.structure.totalHydrogens;

            let html = '';

            // 1. Исходное вещество: разбор слова + формула
            html += (
                '<section class="bg-[#131b2e] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-3">' +
                    '<div class="flex flex-wrap items-end justify-between gap-2">' +
                        renderWordBreakdownHTML(parsed) +
                        '<span class="chem-mono text-sm font-extrabold px-2.5 py-1 rounded-lg bg-sky-500/15 text-sky-300 border border-sky-500/30">' +
                            parsed.structure.formulaHtml +
                        '</span>' +
                    '</div>' +
                    renderFormulaHTML(parsed) +
                '</section>'
            );

            // 2. Гомологи: −Г / +Г -> Название -> Формула -> Столбик
            if (showHomologues) {
                const homologs = generateHomologues(parsed);

                if (homologs.minusG) {
                    const mG = homologs.minusG;
                    html += (
                        '<section class="bg-[#131b2e] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-2.5">' +
                            '<div class="flex items-center gap-2.5 min-w-0">' +
                                '<span class="chem-mono text-xs font-extrabold px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/30 shrink-0">−Г</span>' +
                                '<span class="chem-mono text-base font-bold text-white truncate">' + mG.canonicalName + '</span>' +
                            '</div>' +
                            renderFormulaHTML(mG) +
                            renderColumnCalcHTML(cOrig, hOrig, '−', mG.structure.totalCarbons, mG.structure.totalHydrogens) +
                        '</section>'
                    );
                }

                if (homologs.plusG) {
                    const pG = homologs.plusG;
                    html += (
                        '<section class="bg-[#131b2e] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-2.5">' +
                            '<div class="flex items-center gap-2.5 min-w-0">' +
                                '<span class="chem-mono text-xs font-extrabold px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">+Г</span>' +
                                '<span class="chem-mono text-base font-bold text-white truncate">' + pG.canonicalName + '</span>' +
                            '</div>' +
                            renderFormulaHTML(pG) +
                            renderColumnCalcHTML(cOrig, hOrig, '+', pG.structure.totalCarbons, pG.structure.totalHydrogens) +
                        '</section>'
                    );
                }
            }

            // 3. Изомеры: И1, И2... -> Название -> Формула (с цифрами 1, 2, 3... строго сверху)
            if (showIsomers) {
                const isomers = generateIsomers(parsed);

                for (let i = 0; i < isomers.length; i++) {
                    const iso = isomers[i];
                    html += (
                        '<section class="bg-[#131b2e] border border-slate-800 rounded-2xl p-3.5 shadow-lg space-y-2.5">' +
                            '<div class="flex items-center gap-2.5 min-w-0">' +
                                '<span class="chem-mono text-xs font-extrabold px-2.5 py-1 rounded-lg bg-violet-500/20 text-violet-300 border border-violet-500/30 shrink-0">И' + (i + 1) + '</span>' +
                                '<span class="chem-mono text-base font-bold text-white truncate">' + iso.canonicalName + '</span>' +
                            '</div>' +
                            renderFormulaHTML(iso) +
                        '</section>'
                    );
                }
            }

            out.innerHTML = html;
        }

        // Привязка всех событий после загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            const inputEl = document.getElementById('chemInput');
            const solveBtn = document.getElementById('solveBtn');
            const chkH = document.getElementById('chkHomologues');
            const chkI = document.getElementById('chkIsomers');

            solveBtn.addEventListener('click', solve);
            chkH.addEventListener('change', solve);
            chkI.addEventListener('change', solve);
            inputEl.addEventListener('input', solve);
            inputEl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    inputEl.blur();
                    solve();
                }
            });

            solve();
        });
    </script>
</body>
